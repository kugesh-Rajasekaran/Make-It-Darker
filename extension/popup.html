<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Make It Darker</title>
  <style>
    :root {
      --bg: #17171b;
      --surface: #222228;
      --line: #2e2e36;
      --text: #ececf1;
      --muted: #8d8d98;
      --accent: #8b93ff;
      color-scheme: dark;
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      width: 280px;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif;
    }
    header, section { padding: 14px 16px; }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }
    h1 { font-size: 14px; font-weight: 600; }

    .switch { position: relative; width: 36px; height: 20px; }
    .switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
    .switch span {
      position: absolute; inset: 0; border-radius: 999px;
      background: var(--line); transition: background .15s; pointer-events: none;
    }
    .switch span::after {
      content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px;
      border-radius: 50%; background: var(--text); transition: transform .15s;
    }
    .switch input:checked + span { background: var(--accent); }
    .switch input:checked + span::after { transform: translateX(16px); }
    .switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

    .host {
      font-weight: 500; margin-bottom: 10px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .modes {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px;
      padding: 2px; border-radius: 8px; background: var(--surface);
    }
    .modes button {
      padding: 6px 0; border: 0; border-radius: 6px; cursor: pointer;
      background: none; color: var(--muted); font: inherit;
    }
    .modes button:hover { color: var(--text); }
    .modes button[aria-pressed="true"] { background: var(--line); color: var(--text); }
    .modes button:focus-visible { outline: 2px solid var(--accent); }
    .status { margin-top: 10px; color: var(--muted); }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <header>
    <h1>Make It Darker</h1>
    <label class="switch" title="Dark mode on every site">
      <input id="enabled" type="checkbox" aria-label="Dark mode on every site">
      <span></span>
    </label>
  </header>

  <section id="site" hidden>
    <p class="host" id="host"></p>
    <div class="modes" role="group" aria-label="This site">
      <button data-mode="auto">Auto</button>
      <button data-mode="on">Dark</button>
      <button data-mode="off">Original</button>
    </div>
    <p class="status" id="status"></p>
  </section>

  <section id="unavailable" hidden>
    <p class="status">Not running on this page. Reload it, or it's a browser page that extensions can't change.</p>
  </section>

  <script type="module" src="popup.js"></script>
</body>
</html>
